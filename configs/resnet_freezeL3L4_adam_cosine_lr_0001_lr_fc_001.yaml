# ─────────────────────────────────────────────
#  Experiment identity
# ─────────────────────────────────────────────
exp_name: resnet_freezeL3L4_adam_cosine_lr_0001_lr_fc_001

# ─────────────────────────────────────────────
#  Data
# ─────────────────────────────────────────────
data_path: ./full_dataset/
kinetics_version: "400"

# ─────────────────────────────────────────────
#  Subset / split
#  train_train + train_val come from full_dataset/train via stratified sampling.
#  full_dataset/val is NEVER touched during training.
# ─────────────────────────────────────────────
subset_size: 50000 # videos to sample from train (0 = use all 190k)
val_fraction: 0.2 # fraction of subset → train_val  (50k * 0.2 = 10k)
split_seed: 42 # RNG seed for reproducibility

# ─────────────────────────────────────────────
#  Model
# ─────────────────────────────────────────────
model: r2plus1d_18
weights: null # torchvision weights enum name, e.g. R2Plus1D_18_Weights.DEFAULT
pretrained_path: model/R(2+1)D._18.pth

# ─────────────────────────────────────────────
#  Freezing (hybrid: named strategy OR ratio)
#  Priority: freeze_strategy > freeze_ratio > no freezing
# ─────────────────────────────────────────────
freeze_strategy: r2plus1d_layer3_4 # see VALID_STRATEGIES in freeze_utils.py
freeze_ratio: null # e.g. 0.7  (used only when freeze_strategy is empty)

# ─────────────────────────────────────────────
#  Training hyperparameters
# ─────────────────────────────────────────────
epochs: 15
batch_size: 24
workers: 10

# Optimizer & Differential LR
optimizer: adam
lr: 1.0e-4 # backbone learning rate
lr_fc: 1.0e-3 # fully connected / classifier layer learning rate
weight_decay: 1.0e-4

# Learning Rate Scheduler
lr_scheduler: cosineannealinglr
lr_min: 1.0e-6
lr_warmup_epochs: 2 # still works with cosine since we use SequentialLR
lr_warmup_method: linear
lr_warmup_decay: 0.01

# ─────────────────────────────────────────────
#  Clip / frame settings
# ─────────────────────────────────────────────
clip_len: 16
frame_rate: 4
clips_per_video: 1

# ─────────────────────────────────────────────
#  Augmentation / pre-processing sizes
# ─────────────────────────────────────────────
val_resize_size: [128, 171]
val_crop_size: [112, 112]
train_resize_size: [128, 171]
train_crop_size: [112, 112]

# ─────────────────────────────────────────────
#  Misc
# ─────────────────────────────────────────────
device: cuda
print_freq: 10
amp: false
cache_dataset: false
sync_bn: false
use_deterministic_algorithms: false
test_only: false
resume: ""
start_epoch: 0

# ─────────────────────────────────────────────
#  Distributed
# ─────────────────────────────────────────────
world_size: 1
dist_url: "env://"
